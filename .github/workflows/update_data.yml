name: Daily Data Update

on:
  schedule:
    # 05:00 UTC every day — before most ATP morning matches start
    - cron: "0 5 * * *"
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write  # needed to commit updated CSVs back to the repo

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Python environment ──────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3. Download latest TML match data ─────────────────────────────────
      # Re-downloads current year + challenger + ongoing_tourneys.csv only.
      # Full re-download of all 111 files skipped (historical CSVs don't change).
      # --supplement also downloads the tennis-data.co.uk XLSX and appends any
      # rows newer than TML's latest date, filling TML's typical ~2-week lag.
      - name: Update TML data (current year + TD supplement)
        run: python update_tml_data.py --supplement

      # ── 3b. Snapshot today's Flashscore pre-match odds ────────────────────
      # Appends one row per (match × bookmaker) to
      # data_files/flashscore_odds_history.csv, keyed on event_id + bookmaker
      # + date so re-runs on the same day are idempotent.
      # Failure is non-fatal — odds are supplemental; match data is primary.
      - name: Fetch Flashscore odds snapshot
        run: python fetch_today_odds.py || echo "[warn] Flashscore odds fetch failed — continuing"
      # ── 3c. Snapshot today's Odds API odds ───────────────────────────────
      # Writes data_files/odds_api_today.json — one record per match with
      # the tightest-overround bookmaker. Stamped with today's UTC date so
      # the app can detect stale data. Idempotent: no-op if already run today.
      # Failure is non-fatal; requires ODDS_API_KEY secret to be set.
      - name: Fetch Odds API snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_odds_api.py || echo "[warn] Odds API fetch failed — continuing"
      # ── 4. Rebuild feature matrix ──────────────────────────────────────────
      # Reads all TML files 2020-present, computes rolling ELO, serve stats,
      # recent form, etc. and writes data_files/features_2020_present.parquet
      - name: Build features
        run: python features.py

      # ── 5. Retrain prediction model ────────────────────────────────────────
      # Retrains on the freshly-built feature matrix and writes
      # data_files/tennis_predictor.pkl so predictions reflect today's data.
      - name: Train model
        run: python train.py --no-nn

      # ── 6. Pre-compute prediction backlog ─────────────────────────────────
      # Scores the last 90 days of matches with the new model and writes
      # data_files/prediction_backlog.parquet so the Backlog tab loads
      # instantly without running inference on every page visit.
      - name: Compute prediction backlog
        run: python compute_backlog.py --days 90

      # ── 6b. Export best bets for Sports Picks Grid ────────────────────────
      - name: Export best bets for Sports Picks Grid
        run: python scripts/export_best_bets.py
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}

      # ── 7. Commit any changes ──────────────────────────────────────────────
      # Only creates a commit if files actually changed.
      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tml-data/2026.csv \
                  tml-data/2026_challenger.csv \
                  tml-data/ongoing_tourneys.csv \
                  data_files/features_2020_present.parquet \
                  data_files/tennis_predictor.pkl \
                  data_files/prediction_backlog.parquet \
                  data_files/2026.xlsx \
                  data_files/flashscore_odds_history.csv \
                  data_files/odds_api_today.json \
                  data_files/best_bets_today.json \
                  || true
          # Only commit if there's actually something staged
          git diff --cached --quiet || \
            git commit -m "chore: daily data update $(date -u +%Y-%m-%d)"
          git push
